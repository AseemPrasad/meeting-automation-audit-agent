<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <!-- Dark Glassmorphism Gradient -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="scoreGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Window Container -->
  <rect x="20" y="20" width="1060" height="600" rx="16" fill="url(#windowBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Header / Titlebar -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 1064 20 A 16 16 0 0 1 1080 36 L 1080 68 L 20 68 Z" fill="#1E293B" />
  <line x1="20" y1="68" x2="1080" y2="68" stroke="#334155" stroke-width="1" />

  <!-- macOS Window Dots -->
  <circle cx="50" cy="44" r="6.5" fill="#EF4444" />
  <circle cx="72" cy="44" r="6.5" fill="#F59E0B" />
  <circle cx="94" cy="44" r="6.5" fill="#10B981" />

  <!-- Window Title & Security Badge -->
  <text x="540" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">
    AuditAgent • Cryptographic Compliance Portal [SEC Rule 206(4)-1 / FINRA 2210]
  </text>
  
  <g transform="translate(930, 32)">
    <rect x="0" y="0" width="125" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#34D399" />
    <text x="24" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#6EE7B7">SHA-256 SEALED</text>
  </g>

  <!-- ==================== TOP METRICS BAR ==================== -->
  <!-- Metric Card 1: Compliance Score -->
  <g transform="translate(50, 90)">
    <rect x="0" y="0" width="220" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">COMPLIANCE SCORE</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" fill="#38BDF8">85<tspan font-size="18" fill="#64748B">/100</tspan></text>
    <text x="140" y="62" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#10B981">GRADE A-</text>
  </g>

  <!-- Metric Card 2: Adversarial Audit Summary -->
  <g transform="translate(290, 90)">
    <rect x="0" y="0" width="240" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">ADVERSARIAL VERIFIER</text>
    <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#F87171">1 Confirmed</text>
    <text x="165" y="62" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#6EE7B7">2 Dropped</text>
  </g>

  <!-- Metric Card 3: Cryptographic Certificate Digest -->
  <g transform="translate(550, 90)">
    <rect x="0" y="0" width="480" height="90" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">TAMPER-EVIDENT CERTIFICATE DIGEST</text>
    <text x="20" y="52" font-family="monospace" font-size="12" font-weight="600" fill="#A855F7">SHA256: 8f434346648f6b96df89dda901c5176b10a6d839</text>
    <text x="20" y="72" font-family="monospace" font-size="11" font-weight="400" fill="#64748B">Audio: e3b0c442... • Transcript: 2c26b46b... • Status: VALID</text>
  </g>

  <!-- ==================== MAIN CONTENT: 2-COLUMN VIEW ==================== -->
  
  <!-- Left Column: Diarized Audio Transcript (Verified) -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="480" height="395" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    
    <!-- Header -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 468 0 A 12 12 0 0 1 480 12 L 480 42 L 0 42 Z" fill="#1E293B" fill-opacity="0.5" />
    <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.5">VERIFIED UTTERANCE TIMELINE</text>
    
    <!-- Utterance 1: Advisor -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="60" height="18" rx="4" fill="#312E81"/>
      <text x="30" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">ADVISOR</text>
      <text x="70" y="13" font-family="monospace" font-size="10" fill="#64748B">00:03:14</text>
      <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0">"Good morning! Let's review your portfolio allocation for Q3."</text>
    </g>

    <!-- Utterance 2: Client -->
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="55" height="18" rx="4" fill="#064E3B"/>
      <text x="27" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">CLIENT</text>
      <text x="65" y="13" font-family="monospace" font-size="10" fill="#64748B">00:03:26</text>
      <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="12" fill="#CBD5E1">"I'm worried about downside risk with all this inflation talk."</text>
    </g>

    <!-- Utterance 3: Advisor (Violating claim highlighted) -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="60" height="18" rx="4" fill="#312E81"/>
      <text x="30" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">ADVISOR</text>
      <text x="70" y="13" font-family="monospace" font-size="10" fill="#F87171">00:04:12 - 00:04:35</text>
      
      <!-- Flagged text highlight box -->
      <rect x="-8" y="24" width="455" height="42" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#DC2626" stroke-width="1"/>
      <text x="0" y="40" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#FECACA">"Our wrap fee program has zero internal management expenses."</text>
      <text x="0" y="58" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#F87171">⚠ Flagged: SEC-ADV-FEE-DISCLOSURE (Omission of wrap custodian fees)</text>
    </g>

    <!-- Utterance 4: Advisor -->
    <g transform="translate(20, 285)">
      <rect x="0" y="0" width="60" height="18" rx="4" fill="#312E81"/>
      <text x="30" y="13" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#818CF8" text-anchor="middle">ADVISOR</text>
      <text x="70" y="13" font-family="monospace" font-size="10" fill="#64748B">00:05:01</text>
      <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="12" fill="#E2E8F0">"We can rebalance into short-duration Treasury ETFs as planned."</text>
    </g>
  </g>

  <!-- Right Column: Adversarial Compliance Findings -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="480" height="395" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1" />
    
    <!-- Header -->
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 468 0 A 12 12 0 0 1 480 12 L 480 42 L 0 42 Z" fill="#1E293B" fill-opacity="0.5" />
    <text x="20" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.5">EVIDENTIARY VERIFICATION FINDINGS</text>

    <!-- Violation Card 1 (CONFIRMED) -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="440" height="145" rx="8" fill="#1E293B" stroke="#DC2626" stroke-width="1.2" />
      
      <!-- Badges -->
      <rect x="16" y="14" width="70" height="20" rx="4" fill="#7F1D1D"/>
      <text x="51" y="28" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#FCA5A5" text-anchor="middle">CRITICAL</text>

      <rect x="94" y="14" width="90" height="20" rx="4" fill="#064E3B"/>
      <text x="139" y="28" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#6EE7B7" text-anchor="middle">✓ CONFIRMED</text>

      <text x="195" y="28" font-family="monospace" font-size="11" font-weight="600" fill="#94A3B8">SEC Form ADV Part 2A</text>

      <!-- Verbatim Quote Cited -->
      <text x="16" y="56" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">EXACT VERBATIM AUDIO CITATION (04:12 - 04:35):</text>
      <text x="16" y="74" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FEE2E2">"Our wrap fee program has zero internal management expenses."</text>

      <!-- Remediation Box -->
      <rect x="16" y="90" width="408" height="42" rx="6" fill="#0F172A" />
      <text x="28" y="106" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38BDF8">REQUIRED REMEDIATION:</text>
      <text x="28" y="122" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">Deliver Form ADV Part 2A wrap brochure detailing custodial fees within 48h.</text>
    </g>

    <!-- Violation Card 2 (DROPPED BY VERIFIER - Hallucination Prevented) -->
    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="440" height="130" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      
      <!-- Badges -->
      <rect x="16" y="14" width="165" height="20" rx="4" fill="#374151"/>
      <text x="98" y="28" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" text-anchor="middle">✕ DROPPED (HALLUCINATION)</text>

      <text x="190" y="28" font-family="monospace" font-size="11" font-weight="600" fill="#64748B">FINRA Rule 2210</text>

      <!-- Reason for Drop -->
      <text x="16" y="56" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B">AUDITOR CANDIDATE CLAIM:</text>
      <text x="16" y="74" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">"Advisor guaranteed 20% annual returns without downside."</text>

      <!-- Verifier Cross-Examination Reason -->
      <rect x="16" y="88" width="408" height="30" rx="4" fill="#1E1B4B" />
      <text x="24" y="108" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#A5B4FC">Adversarial Verifier: Statement was spoken by Client, not Advisor. DROPPED.</text>
    </g>
  </g>
</svg>

