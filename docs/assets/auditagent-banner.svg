<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Shield & Accent Glow Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Metallic Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="subtextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Soft radial glow for shield badge -->
    <radialGradient id="shieldBackglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Grid pattern for high-tech aesthetic -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Background Ambient Glow -->
  <circle cx="210" cy="180" r="180" fill="url(#shieldBackglow)" />
  <circle cx="980" cy="80" r="220" fill="url(#shieldBackglow)" opacity="0.4" />

  <!-- Soundwave Visualization Elements (Left to Center) -->
  <g opacity="0.25">
    <rect x="420" y="270" width="4" height="20" rx="2" fill="#38BDF8"/>
    <rect x="432" y="260" width="4" height="40" rx="2" fill="#38BDF8"/>
    <rect x="444" y="250" width="4" height="60" rx="2" fill="#6366F1"/>
    <rect x="456" y="265" width="4" height="30" rx="2" fill="#6366F1"/>
    <rect x="468" y="240" width="4" height="80" rx="2" fill="#818CF8"/>
    <rect x="480" y="255" width="4" height="50" rx="2" fill="#818CF8"/>
    <rect x="492" y="270" width="4" height="20" rx="2" fill="#38BDF8"/>
  </g>

  <!-- ==================== LEFT ICON / EMBLEM ==================== -->
  <g transform="translate(110, 80)">
    <!-- Outer Shield Hexagon Ring -->
    <polygon points="100,0 180,45 180,145 100,195 20,145 20,45" 
             fill="#0F172A" stroke="url(#accentGlow)" stroke-width="3.5" />

    <!-- Inner Shield Shading -->
    <polygon points="100,12 168,51 168,138 100,182 32,138 32,51" 
             fill="#1E1B4B" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />

    <!-- Audio Waveform inside Shield -->
    <g transform="translate(48, 55)">
      <!-- Wave Bars -->
      <rect x="10" y="32" width="6" height="26" rx="3" fill="#38BDF8" />
      <rect x="22" y="18" width="6" height="54" rx="3" fill="#60A5FA" />
      <rect x="34" y="5"  width="6" height="80" rx="3" fill="url(#accentGlow)" />
      <rect x="46" y="22" width="6" height="46" rx="3" fill="#818CF8" />
      <rect x="58" y="12" width="6" height="66" rx="3" fill="#A855F7" />
      <rect x="70" y="28" width="6" height="34" rx="3" fill="#C084FC" />
      <rect x="82" y="36" width="6" height="18" rx="3" fill="#38BDF8" />
    </g>

    <!-- Cryptographic Lock Badge (Centered at bottom of shield) -->
    <g transform="translate(82, 130)">
      <circle cx="18" cy="18" r="22" fill="#090D16" stroke="url(#accentGlow)" stroke-width="2.5" />
      <!-- Lock Shackle -->
      <path d="M12 16 V11 A6 6 0 0 1 24 11 V16" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="9" y="16" width="18" height="13" rx="2.5" fill="url(#accentGlow)"/>
      <circle cx="18" cy="22" r="2" fill="#090D16"/>
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY & BRAND ==================== -->
  <g transform="translate(360, 115)">
    <!-- Subtitle / Tagline Pill -->
    <g transform="translate(0, -32)">
      <rect x="0" y="0" width="370" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="5" fill="#10B981"/>
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">ENTERPRISE COMPLIANCE &amp; AUDIT INTELLIGENCE</text>
    </g>

    <!-- Brand Name Title -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="64" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      Audit<tspan fill="url(#subtextGrad)">Agent</tspan>
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="20" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Legally Defensible AI Compliance &amp; Evidentiary Sealing
    </text>

    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="15" font-weight="400" fill="#64748B" letter-spacing="0.2">
      Two-Tier Adversarial AI • SHA-256 Chained Audits • SEC/FINRA Defense • B2B SaaS
    </text>

    <!-- Tech Stack Feature Pills -->
    <g transform="translate(0, 168)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">SHA-256 SEALED</text>

      <!-- Pill 2 -->
      <rect x="135" y="0" width="135" height="26" rx="6" fill="#0F172A" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
      <text x="147" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#818CF8">ADVERSARIAL VERIFIER</text>

      <!-- Pill 3 -->
      <rect x="280" y="0" width="130" height="26" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="292" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#C084FC">ASYNC CELERY / REDIS</text>

      <!-- Pill 4 -->
      <rect x="420" y="0" width="125" height="26" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="432" y="17" font-family="monospace" font-size="11" font-weight="600" fill="#34D399">STRIPE B2B SAAS</text>
    </g>
  </g>
</svg>

